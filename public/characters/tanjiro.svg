  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8d7"/>
      <stop offset="100%" stop-color="#ecc6ab"/>
    </linearGradient>
    <linearGradient id="paleSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2eff5"/>
      <stop offset="100%" stop-color="#d5cedd"/>
