      <stop offset="70%" stop-color="#5c1624"/>
      <stop offset="100%" stop-color="#801d2e"/>
    </linearGradient>
    <linearGradient id="flameBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1c24"/>
      <stop offset="70%" stop-color="#3a1c1e"/>
      <stop offset="100%" stop-color="#ff6b2b"/>
    </linearGradient>
    
  </defs>
